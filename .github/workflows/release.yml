name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          bash -n scripts/linux-inspector.sh
          bash -n tests/smoke-test.sh
          bash tests/smoke-test.sh
          shellcheck scripts/linux-inspector.sh tests/smoke-test.sh
      - name: Prepare assets
        run: |
          mkdir dist
          cp scripts/linux-inspector.sh dist/linux-inspector.sh
          cd dist
          sha256sum linux-inspector.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(bash scripts/linux-inspector.sh --version)"
          gh release create "$version" dist/linux-inspector.sh dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$version" \
            --notes "Linux System & Service Inspector $version. Read-only Linux environment inspection. Verify SHA256SUMS before use."
